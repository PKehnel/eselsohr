name: Dependency audit

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
    inputs:
      exercise_issue:
        description: Verify private issue creation, updating, closing and reopening with a clearly synthetic test
        type: boolean
        default: false
  push:
    paths: ['package.json', 'package-lock.json', 'tools/audit.mjs', 'tools/security-issue.mjs', 'tests/security-issue.test.mjs', '.github/workflows/dependency-audit.yml']
  pull_request:
    paths: ['package.json', 'package-lock.json', 'tools/audit.mjs', 'tools/security-issue.mjs', 'tests/security-issue.test.mjs', '.github/workflows/dependency-audit.yml']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      counts: ${{ steps.scan.outputs.counts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - id: scan
        run: npm run audit:dependencies
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-audit
          path: test-artifacts/security/npm-audit.json
          if-no-files-found: error
          retention-days: 30
  issue:
    needs: audit
    if: ${{ always() && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      group: security-issue-dependencies
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Update private security issue
        run: node tools/security-issue.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          SECURITY_CHECK: dependencies
          SECURITY_RESULT: ${{ needs.audit.result }}
          SECURITY_COUNTS: ${{ needs.audit.outputs.counts }}
          SECURITY_ISSUE_EXERCISE: ${{ github.event_name == 'workflow_dispatch' && inputs.exercise_issue }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: issue-notification
          path: test-artifacts/security/issue-notification.json
          if-no-files-found: error
          retention-days: 30
